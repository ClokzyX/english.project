<title>English Project — Trainer</title>
<style>
:root{color-scheme:light;--tx:#1e293b;--mut:#64748b;--pri:#4f8cff;--ok:#22c55e;--bad:#ef4444;--ln:#e6ecf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{color:var(--tx);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif;background:#f7faff}

.pc{padding:26px;border-radius:22px;background:rgba(255,255,255,.75)}.pc h2{margin:0 0 4px;font-size:26px}.pc p{margin:0 0 16px;color:var(--mut)}

.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:30}.fb.ok{background:#dcfce7}.fb.no{background:#fee2e2}.fb>div{max-width:588px;margin:0 auto}.fb b{display:block;font-size:19px;margin-bottom:10px}

.vt{width:100%;border-collapse:collapse;min-width:520px}.vt th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#64748b;padding:10px 12px}.vt td{padding:10px 12px;border-top:1px solid var(--ln)}.vt tr:hover td{background:#eef4ff}.vt td:nth-child(2){font-weight:800;color:var(--pri)}

.opt{font-size:18px;padding:16px}

.fl{min-width:140px}

/* ================= ПРАВИЛА ================= */
.rules-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
.rules-title h2 { margin: 0 0 4px; font-size: clamp(28px, 5vw, 40px); font-weight: 900; letter-spacing: -.02em; }
.rules-title p { margin: 0; color: var(--mut); }
.rl { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
@media(max-width: 860px) { .rl { grid-template-columns: 1fr; } }
.rn { position: sticky; top: 90px; background: rgba(255,255,255,.6); backdrop-filter: blur(10px); border-radius: 20px; padding: 16px; border: 1px solid rgba(255,255,255,.8); }
.rg { margin-bottom: 20px; }
.rg:last-child { margin-bottom: 0; }
.gh { font-weight: 900; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin: 0 0 10px 8px; }
.rb { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px; border-radius: 12px; font-weight: 800; font-size: 15px; color: var(--mut); cursor: pointer; font-family: inherit; transition: color 0.2s; }
.rb:hover { color: var(--tx); background: rgba(255,255,255,0.5); }
.rb.on { color: var(--tx); }
.rbp { position: absolute; inset: 0; border-radius: 12px; background: #fff; box-shadow: 0 4px 12px rgba(148,163,184,.2); z-index: 0; }
.rbt { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
@media(max-width: 860px) { .rn { position: static; display: flex; gap: 12px; overflow-x: auto; padding: 12px; } .rn .gh { display: none; } .rg { display: flex; gap: 6px; margin-bottom: 0; } .rb { white-space: nowrap; width: auto; } }
.rc-container { background: rgba(255,255,255,.85); border-radius: 24px; padding: 32px; box-shadow: 0 10px 30px -8px rgba(148,163,184,.2); border: 1px solid rgba(255,255,255,.9); }
.rc-title { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 900; margin: 0 0 24px; padding-bottom: 16px; border-bottom: 2px solid #f1f5f9; }
.rc-title span { font-size: 32px; }
.rs { margin-bottom: 32px; }
.rs:last-child { margin-bottom: 0; }
.rh { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; margin-bottom: 12px; color: #1e293b; }
.rh b { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #4f8cff, #a06bff); color: #fff; display: grid; place-items: center; font-size: 14px; flex: none; }
.rs p { margin: 0 0 16px; color: #475569; font-size: 16px; line-height: 1.6; }
.rx { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px 18px; margin: 10px 0; transition: all 0.2s ease; }
.rx:hover { background: #fff; border-color: #cbd5e1; box-shadow: 0 6px 16px rgba(148,163,184,.12); transform: translateY(-2px); }
.rx span { font-weight: 800; color: #1e293b; font-size: 16px; }
.rx i { font-style: normal; color: #64748b; font-size: 15px; text-align: right; }
@media(max-width: 600px) { .rx { grid-template-columns: 1fr; gap: 6px; } .rx i { text-align: left; } .rc-container { padding: 20px; } }

/* ================= О ПРОЕКТЕ ================= */
.team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 24px; }
@media(max-width: 800px) { .team-grid { grid-template-columns: 1fr; } }
.team-card { position: relative; background: rgba(255,255,255,.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.9); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; transition: transform 0.3s ease, box-shadow 0.3s ease; overflow: hidden; }
.team-card:hover { transform: translateY(-5px) scale(1.01); box-shadow: 0 20px 40px -10px rgba(79,140,255,.25); }
.team-card.lead { grid-column: 1 / -1; background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,246,255,0.85)); flex-direction: row; align-items: center; }
@media(max-width: 800px) { .team-card.lead { flex-direction: column; align-items: flex-start; } }
.team-photo-wrap { position: relative; flex-shrink: 0; }

.team-info .role { color: #4f8cff; font-weight: 800; font-size: 14px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.team-info p { margin: 0 0 16px; color: #64748b; font-size: 15px; line-height: 1.6; }
.team-tags { display: flex; flex-wrap: wrap; gap: 8px; }

function Chat({lang}){
 const t = L[lang];
 const key = CHAT_KEY + '_' + lang;
 const [m, setM] = useState(() => { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : INIT_CHAT[lang]; } catch { return INIT_CHAT[lang]; } });
 const [step, setStep] = useState(() => { try { const s = localStorage.getItem(key + '_step'); return s ? parseInt(s) : 0; } catch { return 0; } });
 const [ci, setCi] = useState(0);
 const box = useRef(null);

 useEffect(() => { box.current && box.current.scrollTo({top: box.current.scrollHeight, behavior: 'smooth'}) }, [m]);

 useEffect(() => {
   localStorage.setItem(key, JSON.stringify(m));
   localStorage.setItem(key + '_step', step.toString());
 }, [m, step, key]);

 const req = CHAT_STEPS[lang][step] ? CHAT_STEPS[lang][step].req : [];

  const send = (phraseChip, catIdx) => {
    const fullSentence = CHAT_SENTENCES[phraseChip] || phraseChip;
    setM(x => [...x, {t: fullSentence, user: true}]);

    if (req.includes(catIdx)) {
      if (step < CHAT_STEPS[lang].length) {
        setTimeout(() => {
          setM(x => [...x, {b: 1, t: CHAT_STEPS[lang][step].nextBot}]);
          setStep(step + 1);
        }, 800);
      }
    } else {
      setTimeout(() => {
        const hint = req.map(i => CATS[i][lang]).join(' or ');
        setM(x => [...x, {b: 1, t: `${t.chatHint}${hint}`}]);
      }, 800);
    }
  };

 const reset = () => {
   setM(INIT_CHAT[lang]);
   setStep(0);
   localStorage.removeItem(key);
   localStorage.removeItem(key + '_step');
 };

 return html`<div>
   <div className="tip">
     <span>🤖 ${t.chatGoal}</span>
     <button className="btn t" style=${{padding:'4px 10px',fontSize:12,border:'1px solid #dbe3f1'}} onClick=${reset}>${t.resetChat}</button>
   </div>
   <div className="glass" style=${{marginBottom:14}}>
     <div className="chat" ref=${box} aria-live="polite">
       ${m.map((x,k)=>html`<${motion.div} key=${k} className=${'bb '+(x.b?'bot':'me')} initial=${{opacity:0,y:10,scale:.95}} animate=${{opacity:1,y:0,scale:1}}>${x.t}<//>`)}
     </div>
   </div>
   <div className="glass cc">
     <div className="ph" style=${{marginBottom:12}}>
       ${CATS.map((c,k)=>html`<button key=${k} className=${'cp '+(ci==k?'on':'')} onClick=${()=>setCi(k)}>${c[lang]}</button>`)}
     </div>
     <div className="ph">
       ${CATS[ci].list.split(';').map(p=>html`<${motion.button} key=${p} className="pp cl" whileHover=${{y:-3}} whileTap=${{scale:.94}} onClick=${()=>send(p, ci)}>${p}<//>`)}
     </div>
   </div>
 </div>`;
}

const RL=[
{id:'be',g:'Present Simple',i:'🙋',t:'Verb to be',s:[
  {h:{ru:'Формы глагола',en:'Forms'},p:{ru:'Глагол be в настоящем времени меняется по лицам. В английском он обязателен: «Я студент» = I am a student.',en:'The verb "be" changes by person in the present tense. In English, it is mandatory: "Я студент" = I am a student.'},ex:['I am (I’m) Dave. — Я Дэйв.','He / She / It is (’s) from the UK. — Он / она / оно из Великобритании.','We / You / They are (’re) friends. — Мы / вы / они друзья.']},
  {h:{ru:'Отрицание',en:'Negative'},p:{ru:'Добавляем not после глагола. Краткие формы: isn’t, aren’t. С I используется только I’m not.',en:'Add "not" after the verb. Short forms: isn’t, aren’t. With "I", only "I’m not" is used.'},ex:['I’m not a student. — Я не студент.','Andrew isn’t from Italy. — Эндрю не из Италии.','They aren’t here. — Их здесь нет.']},
  {h:{ru:'Вопросы и краткие ответы',en:'Questions & Short Answers'},p:{ru:'Глагол be ставим перед подлежащим. В кратком ответе повторяем be, а не основной глагол.',en:'Put "be" before the subject. In short answers, repeat "be", not the main verb.'},ex:['Are you a student? — Yes, I am. / No, I’m not.','Is it your name? — No, it isn’t.','Are we friends? — Yes, we are.']}
]},
{id:'this',g:'Present Simple',i:'👜',t:'This/that, possessives',s:[
  {h:{ru:'This / that / these / those',en:'This / that / these / those'},p:{ru:'this и these — предметы рядом с нами, that и those — далеко. this и that — один предмет, these и those — несколько.',en:'this and these — objects near us, that and those — far away. this and that — one object, these and those — several objects.'},ex:['This is my pen. — Это моя ручка (рядом).','That is my bag. — Это моя сумка (вдали).','These are my keys. — Это мои ключи (рядом).','Those are windows. — Это окна (вдали).']},
  {h:{ru:'Притяжательные слова',en:'Possessive adjectives'},p:{ru:'my, your, his, her, its, our, their ставятся перед существительным.',en:'my, your, his, her, its, our, their are placed before a noun.'},ex:['Is this your phone? — Это твой телефон?','Her name is Anya. — Её зовут Аня.']},
  {h:{ru:'Mine / yours — без существительного',en:'Mine / yours (without noun)'},p:{ru:'Когда существительного нет, используем mine, yours, his, hers, ours, theirs.',en:'When there is no noun, we use mine, yours, his, hers, ours, theirs.'},ex:['This bag is mine. — Эта сумка моя.','It’s yours. — Это твоё.']},
  {h:{ru:'Принадлежность с ’s',en:'Possessive ’s'},p:{ru:'Для людей добавляем ’s к владельцу: не «bag of my friend», а my friend’s bag.',en:'For people, we add ’s to the owner: not "bag of my friend", but my friend’s bag.'},ex:['That’s Sally’s bag. — Это сумка Салли.','It’s my friend’s mobile. — Это телефон моего друга.']}
]},
{id:'ps',g:'Present Simple',i:'📅',t:'Present Simple',s:[
  {h:{ru:'Когда используем',en:'When to use'},p:{ru:'Для регулярных действий, привычек и фактов. Сигналы: every day, usually, on Fridays, at the weekend.',en:'For regular actions, habits, and facts. Signals: every day, usually, on Fridays, at the weekend.'},ex:['I get up at seven every day. — Я встаю в семь каждый день.']},
  {h:{ru:'Утверждение',en:'Affirmative'},p:{ru:'I / you / we / they + глагол. He / she / it + глагол с -s. Особые случаи: -es после s, sh, ch, x, o (watches, goes); согласная + y → -ies (studies); have → has.',en:'I / you / we / they + verb. He / she / it + verb with -s. Special cases: -es after s, sh, ch, x, o (watches, goes); consonant + y → -ies (studies); have → has.'},ex:['We watch films in the evening. — Мы смотрим фильмы вечером.','She gets up at six. — Она встаёт в шесть.','He has a great job. — У него отличная работа.']},
  {h:{ru:'Отрицание',en:'Negative'},p:{ru:'don’t (I, you, we, they) или doesn’t (he, she, it) + глагол без -s.',en:'don’t (I, you, we, they) or doesn’t (he, she, it) + verb without -s.'},ex:['I don’t eat junk food. — Я не ем фастфуд.','Alice doesn’t like flying. — Элис не любит летать.']},
  {h:{ru:'Вопросы и краткие ответы',en:'Questions & Short Answers'},p:{ru:'Do или Does в начале. После does основной глагол без -s.',en:'Do or Does at the beginning. After does, the main verb is without -s.'},ex:['Do you study English? — Yes, I do.','Does she want to be a pilot? — No, she doesn’t.','What time does it start? — Во сколько это начинается?']}
]},
{id:'adv',g:'Present Simple',i:'⏱️',t:'Adverbs of frequency',s:[
  {h:{ru:'Шкала частоты',en:'Frequency Scale'},p:{ru:'never (0%) → hardly ever → sometimes → often → usually → always (100%).',en:'never (0%) → hardly ever → sometimes → often → usually → always (100%).'},ex:['I always drink coffee. — Я всегда пью кофе.','We hardly ever see each other. — Мы почти никогда не видимся.']},
  {h:{ru:'Где ставить наречие',en:'Where to place'},p:{ru:'После глагола be, но перед остальными глаголами.',en:'After the verb "be", but before other verbs.'},ex:['He is never late. — Он никогда не опаздывает.','We often play football. — Мы часто играем в футбол.']},
  {h:{ru:'Выражения и предлоги',en:'Expressions & Prepositions'},p:{ru:'once a week, twice a year, three times a day. Предлоги: on Fridays, in June, at 7.30, at the weekend, in the morning.',en:'once a week, twice a year, three times a day. Prepositions: on Fridays, in June, at 7.30, at the weekend, in the morning.'},ex:['I go to the gym twice a week. — Я хожу в зал дважды в неделю.','My birthday is in June. — Мой день рождения в июне.']}
]},
{id:'hg',g:'Present Simple',i:'🏠',t:'Have got · There is/are',s:[
  {h:{ru:'Have got',en:'Have got'},p:{ru:'I / you / we / they have got, he / she / it has got. Отрицание: haven’t / hasn’t got. Вопрос: Have you got…? Has he got…?',en:'I / you / we / they have got, he / she / it has got. Negative: haven’t / hasn’t got. Question: Have you got…? Has he got…?'},ex:['They have got sixteen children. — У них шестнадцать детей.','She hasn’t got a car. — У неё нет машины.','Has he got a job? — Yes, he has.']},
  {h:{ru:'There is / there are',en:'There is / there are'},p:{ru:'There is — для одного предмета, there are — для нескольких. Отрицание: there isn’t / there aren’t. Вопрос: Is there…? Are there…?',en:'There is — for one object, there are — for several. Negative: there isn’t / there aren’t. Question: Is there…? Are there…?'},ex:['There is a desk in the room. — В комнате есть стол.','There are chairs and a table. — Есть стулья и стол.','Are there any buses at night? — Ночью есть автобусы?']},
  {h:{ru:'Предлоги места',en:'Prepositions of place'},p:{ru:'in, on, under, above, behind, between, next to, near, opposite, in front of.',en:'in, on, under, above, behind, between, next to, near, opposite, in front of.'},ex:['The cat is in front of the dog. — Кошка перед собакой.','The lamp is between the sofa and the table. — Лампа между диваном и столом.']}
]},
{id:'pc',g:'Present Continuous',i:'🎬',t:'Present Continuous',s:[
  {h:{ru:'Когда используем',en:'When to use'},p:{ru:'Действие происходит прямо сейчас или в этот период. Сигналы: now, at the moment, today, Look!, Listen!',en:'The action is happening right now or during this period. Signals: now, at the moment, today, Look!, Listen!'},ex:['Look! It’s raining. — Смотри! Идёт дождь.']},
  {h:{ru:'Как образуется',en:'How to form'},p:{ru:'am / is / are + глагол с -ing.',en:'am / is / are + verb with -ing.'},ex:['I am reading a book now. — Я сейчас читаю книгу.','They are playing football. — Они играют в футбол.']},
  {h:{ru:'Правописание -ing',en:'Spelling -ing'},p:{ru:'Убираем немое -e (have → having). Удваиваем согласную в коротких словах (run → running, swim → swimming).',en:'Drop the silent -e (have → having). Double the consonant in short words (run → running, swim → swimming).'},ex:['We are running in the park. — Мы бежим в парке.','He is having a coffee. — Он пьёт кофе.']},
  {h:{ru:'Отрицание и вопросы',en:'Negative & Questions'},p:{ru:'Отрицание: isn’t / aren’t / I’m not + -ing. Вопрос: am / is / are перед подлежащим.',en:'Negative: isn’t / aren’t / I’m not + -ing. Question: am / is / are before the subject.'},ex:['She isn’t sleeping. — Она не спит.','What are you doing? — Что ты делаешь?']},
  {h:{ru:'Simple или Continuous?',en:'Simple vs Continuous'},p:{ru:'Present Simple — регулярно, Present Continuous — сейчас. Глаголы like, know, want обычно не используются в Continuous.',en:'Present Simple — regularly, Present Continuous — right now. Verbs like, know, want are usually not used in Continuous.'},ex:['I get up at 7 every day. — Я встаю в 7 каждый день.','I’m having breakfast now. — Я завтракаю сейчас.']}
]},
{id:'wr',g:'Past Simple',i:'🕰️',t:'Was / were',s:[
  {h:{ru:'Формы',en:'Forms'},p:{ru:'I / he / she / it — was. We / you / they — were.',en:'I / he / she / it — was. We / you / they — were.'},ex:['I was at home last night. — Я был дома вчера вечером.','Her parents were very poor. — Её родители были очень бедны.']},
  {h:{ru:'Отрицание и вопросы',en:'Negative & Questions'},p:{ru:'wasn’t / weren’t. В вопросе was / were идёт перед подлежащим.',en:'wasn’t / weren’t. In questions, was / were goes before the subject.'},ex:['She wasn’t shy. — Она не была застенчивой.','Were you born in this country? — Yes, I was.']},
  {h:{ru:'Слова-сигналы',en:'Signal words'},p:{ru:'yesterday, last night / week / year, in 2015, a week ago, on Saturday.',en:'yesterday, last night / week / year, in 2015, a week ago, on Saturday.'},ex:['We were in Paris yesterday. — Вчера мы были в Париже.']}
]},
{id:'pst',g:'Past Simple',i:'⏪',t:'Past Simple',s:[
  {h:{ru:'Правильные глаголы',en:'Regular verbs'},p:{ru:'Добавляем -ed: work → worked. Если глагол оканчивается на -e, добавляем -d (love → loved). Согласная + y → -ied (study → studied). Короткие глаголы удваивают согласную (stop → stopped).',en:'Add -ed: work → worked. If the verb ends in -e, add -d (love → loved). Consonant + y → -ied (study → studied). Short verbs double the consonant (stop → stopped).'},ex:['Samiya started university at fifteen. — Самия поступила в университет в пятнадцать.','She loved her village. — Она любила свою деревню.']},
  {h:{ru:'Произношение -ed',en:'Pronunciation -ed'},p:{ru:'/t/ — finished, worked. /d/ — moved, loved. /ɪd/ — started, wanted (после t и d).',en:'/t/ — finished, worked. /d/ — moved, loved. /ɪd/ — started, wanted (after t and d).'},ex:['I wanted to see a film. — Я хотел посмотреть фильм.']},
  {h:{ru:'Неправильные глаголы',en:'Irregular verbs'},p:{ru:'Форма не подчиняется правилу, её нужно знать: go → went, buy → bought, have → had. Полный список смотри во вкладке «Глаголы».',en:'The form doesn\'t follow the rule, you need to know it: go → went, buy → bought, have → had. See the full list in the "Verbs" tab.'},ex:['Lidia became a model. — Лидия стала моделью.','He bought a new phone. — Он купил новый телефон.']},
  {h:{ru:'Отрицание и вопросы',en:'Negative & Questions'},p:{ru:'didn’t + глагол в начальной форме. Did + подлежащее + глагол в начальной форме. Отвечаем Yes, I did. / No, I didn’t.',en:'didn’t + base verb. Did + subject + base verb. Answer Yes, I did. / No, I didn’t.'},ex:['I didn’t have a car. — У меня не было машины.','Did she go to university? — Yes, she did.']},
  {h:{ru:'Слова-сигналы',en:'Signal words'},p:{ru:'yesterday, last week, in 1999, two days ago, on Saturday.',en:'yesterday, last week, in 1999, two days ago, on Saturday.'},ex:['We went to the museum last Sunday. — В прошлое воскресенье мы ходили в музей.']}
]},
{id:'irr',g:'Past Simple',i:'🔥',t:'Irregular verbs',s:[
  {h:{ru:'Три формы',en:'Three forms'},p:{ru:'У неправильного глагола три формы: инфинитив, Past Simple, Past Participle (3-я форма). В Past Simple берём вторую.',en:'An irregular verb has three forms: infinitive, Past Simple, Past Participle (3rd form). For Past Simple, we take the second.'},ex:['go — went — gone','see — saw — seen']},
  {h:{ru:'Все формы одинаковые',en:'All forms are the same'},p:{ru:'Эти глаголы не меняются совсем.',en:'These verbs don\'t change at all.'},ex:['cost — cost — cost','cut — cut — cut','read — read — read (произносится /red/)']},
  {h:{ru:'Группы по похожести',en:'Similarity groups'},p:{ru:'Так проще запоминать: buy — bought, catch — caught, fight — fought (-ought / -aught). build — built, spend — spent, feel — felt (-t).',en:'It\'s easier to remember this way: buy — bought, catch — caught, fight — fought (-ought / -aught). build — built, spend — spent, feel — felt (-t).'},ex:['I bought a ticket. — Я купил билет.','She felt tired. — Она чувствовала усталость.']}
]}
];

function Rules({go,lang}){
 const t = L[lang];
 const [id,setId]=useState('be'),r=RL.find(x=>x.id==id),ui=U.findIndex(u=>u.id==id);
 return html`<div>
   <div className="rules-header">
     <div className="rules-title">
       <h2>${t.nav.rules}</h2>
       <p>${t.rulesSub}</p>
     </div>
     <button className="iconbtn no-print" onClick=${printRules}>🖨 Print Cheat Sheet ↗</button>
   </div>

   <div className="rl">
     <div className="rn">
       ${['Present Simple','Present Continuous','Past Simple'].map(g=>html`<div key=${g} className="rg">
         <div className="gh">${g}</div>
         ${RL.filter(x=>x.g==g).map(x=>html`<button key=${x.id} className=${'rb '+(id==x.id?'on':'')} onClick=${()=>setId(x.id)}>
           ${id==x.id&&html`<${motion.span} layoutId="ruleTab" className="rbp" transition=${{type:'spring',stiffness:380,damping:30}}/>`}
           <span className="rbt">${x.i} ${x.t}</span>
         </button>`)}
       </div>`)}
     </div>
     
     <${AnimatePresence} mode="wait">
       <${motion.div} key=${id} className="rc-container" initial=${{opacity:0, y:15}} animate=${{opacity:1, y:0}} exit=${{opacity:0, y:-15}} transition=${{duration:0.25}}>
         <div className="rc-title">
           <span>${r.i}</span> ${r.t}
         </div>
         
         ${r.s.map((sec,k)=>html`<div key=${k} className="rs">
           <div className="rh"><b>${k+1}</b>${sec.h[lang]}</div>
           <p>${sec.p[lang]}</p>
           ${sec.ex.map(e=>{
             const parts = e.split(' — ');
             const en = parts[0];
             const ru = parts.length > 1 ? parts.slice(1).join(' — ') : '';
             return html`<div key=${e} className="rx">
               <span>${en}</span>
               ${ru && html`<i>${ru}</i>`}
             </div>`
           })}
         </div>`)}
         
         <div style=${{marginTop:30, paddingTop:20, borderTop:'1px solid #f1f5f9'}}>
           <${motion.button} className="btn" whileHover=${{scale:1.03}} whileTap=${{scale:.97}} onClick=${()=>go('intro',ui)}>${t.train} →<//>
         </div>
       <//>
     <//>
   </div>
 </div>`}

const TEAM = {

    { name: 'Коклягин Святослав', initials: 'КС', role: 'Отвечал за фразы и тестирование', desc: 'Подготовил фразы и диалоги для дискуссии, проверял работу всех разделов сайта и искал ошибки.', tags: ['QA', 'Диалоги', 'Контент'], gradient: 'linear-gradient(135deg,#22c55e,#14b8a6)', imgKey: 'ks' }

function About({lang}){
 const t = L[lang], team = TEAM[lang];
 return html`<footer className="ab"><${motion.div} initial=${{opacity:0,y:30}} whileInView=${{opacity:1,y:0}} viewport=${{once:true}} transition=${{duration:.6}}>
 <div className="h2" style=${{marginTop:80}}>${t.aboutTitle}</div>
 <p className="hp">${t.aboutSub}</p>
 
 <div className="team-grid">
   ${team.map((member,k)=>html`<${motion.div} key=${member.name} className=${'team-card ' + (member.isLead ? 'lead' : '')} initial=${{opacity:0,y:20}} whileInView=${{opacity:1,y:0}} viewport=${{once:true}} transition=${{delay:k*.1}}>
      <div className="team-photo-wrap">
        ${IMG[member.imgKey] ? html`<img className="team-photo" src=${IMG[member.imgKey]} alt=${member.name} loading="lazy"/>` : html`<div className="team-photo" style=${{background:member.gradient,color:'#fff',display:'grid',placeItems:'center',fontSize:32,fontWeight:900}}>${member.initials}</div>`}
      </div>
      <div className="team-info">
        <h3>${member.name}</h3>
        <div className="role">${member.role}</div>
        <p>${member.desc}</p>
        <div className="team-tags">
          ${member.tags.map(tag=>html`<span className="team-tag">${tag}</span>`)}
        </div>
      </div>
   <//>`)}
 </div>

 <div className="ai" style=${{marginTop:32}}>
   ${IMG.ai ? html`<img className="av sm" src=${IMG.ai} alt="Claude"/>` : html`<div className="av sm" style=${{background:'linear-gradient(135deg,#a78bfa,#6366f1)'}}>🤖</div>`}
   <p><b>Claude (Anthropic)</b> — AI assistant. Role: helped write and debug the site code upon Dmitry's request. Structure, educational material, solutions, and verification — by the project team.</p>
 </div>
 <p style=${{textAlign:'center',color:'#94a3b8',fontSize:14,marginTop:24}}>© 2026 · English Language Project, UTMN</p><//></footer>`}

function Page({t,p,children}){return html`<div className="pg"><div className="pt">${t}</div><p className="ps">${p}</p>${children}</div>`}

function Hero({nav,S,go,lang}){
 const t = L[lang];
 const W=t.heroTitle, F=[['went','went','left',8],['am reading','reading','right',12],['a library','library','left',42],['has got','has','right',48],['bought','bought','left',74],['Past Simple','Past','right',76]];
 const done=S?Object.keys(S.d||{}).length:0;
 const nextIdx=U.findIndex(u=>!S?.d[u.id]);
 let ctaLabel=t.startPath,ctaAction=()=>nav('path');
 if(done>0&&nextIdx>=0){ctaLabel=t.continuePath+U[nextIdx].t;ctaAction=()=>go('intro',nextIdx)}
 else if(nextIdx===-1){ctaLabel=t.viewReport;ctaAction=()=>nav('report')}
 return html`<section className="hero">${F.map((f,i)=>html`<${FlyCard} key=${i} f=${f} i=${i}/>`)}
 <h1>${W.map((x,i)=>html`<${motion.span} key=${i} className=${i==2||i==4?'grad':''} initial=${{opacity:0,y:36,rotate:4}} animate=${{opacity:1,y:0,rotate:0}} transition=${{delay:i*.12,type:'spring',stiffness:120,damping:14}}>${x}${i<W.length-1?'\u00a0':''}<//>`)}</h1>
 <${motion.p} className="sub" initial=${{opacity:0}} animate=${{opacity:1}} transition=${{delay:.8}}>${t.heroSub}<//>
 <${motion.button} className="cta" initial=${{opacity:0,y:20}} animate=${{opacity:1,y:0}} transition=${{delay:1}} whileHover=${{y:-6,scale:1.06,transition:{type:'spring',stiffness:320,damping:14}}} whileTap=${{scale:.96}} onClick=${ctaAction}>${ctaLabel} <${ArrowRight} size=${22} style=${{verticalAlign:'-4px',marginLeft:6}}/><//>
 <div><button className="link" onClick=${()=>nav('play')}>${t.tryMini}</button></div></section>`}

const FW=[['went','went'],['bought','bought'],['am reading','reading'],['has got','has'],['a library','library'],['Past Simple','Past'],['was / were','was/were'],['took','took'],['is playing','playing'],['has got','has'],['a kitchen','kitchen'],['was','was'],['usually','usually'],['saw','saw'],['are running','running'],['often','often'],['there is','there is'],['wrote','wrote'],['a pharmacy','pharmacy'],['talkative','talkative'],['in front of','in front of'],['don’t eat','don\'t eat'],['a waiter','waiter'],['between','between']];
function FlyCard({f,i}){
 const sub=FW.filter((_,k)=>k%6==i),[k,setK]=useState(0);
 useEffect(()=>{const id=setInterval(()=>setK(x=>(x+1)%sub.length),4200+i*650);return()=>clearInterval(id)},[]);
 const w=sub[k];

 if(tab=='phr')return html`<${Page} t=${'💬 ' + t.phrases} p=${t.phrasesSub}><${Phrases} lang=${lang}/><//>`;
 if(tab=='verbs')return html`<${Page} t=${'🔥 ' + t.verbs} p=${t.verbsSub}><${Verbs} go=${go} lang=${lang}/><//>`;
 return html`<div><${Hero} nav=${nav} S=${S} go=${go} lang=${lang}/><div className="h2">${t.bentoTitle}</div><p className="hp">${t.bentoSub}</p><${Bento} lang=${lang}/><${About} lang=${lang}/></div>`}

function App(){
 const [S,setS]=useState(load),[r,setR]=useState({s:'home'}),[tab,setTab]=useState('home');
 const [lang,setLang]=useState(() => { try { return localStorage.getItem(LANG_KEY) || 'en'; } catch { return 'en'; } });

 useEffect(() => { localStorage.setItem(LANG_KEY, lang); }, [lang]);

 const save=n=>{const data=cleanProgress(n);setS(data);try{const raw=JSON.stringify(data);localStorage.setItem(PROGRESS_KEY,raw);localStorage.setItem(PROGRESS_BACKUP_KEY,raw)}catch(e){console.warn('Save failed:',e)}};
 useEffect(()=>{let f=0,x=0,y=0;const m=e=>{x=e.clientX;y=e.clientY;if(!f)f=requestAnimationFrame(()=>{f=0;const s=document.documentElement.style;s.setProperty('--mx',x+'px');s.setProperty('--my',y+'px')})};addEventListener('mousemove',m,{passive:true});return()=>removeEventListener('mousemove',m)},[]);
 const go=(s,i,x)=>{if(x&&x.back)setTab('path');setR({s,i,...x});scrollTo(0,0)};
 const nav=t=>{setTab(t);setR({s:'home'});scrollTo(0,0)};
 let c;
 const t = L[lang];

 if(r.s=='intro'){const u=U[r.i];c=html`<div><div className="glass card"><h2>${u.i} ${u.t}</h2>${u.rule?html`<div dangerouslySetInnerHTML=${{__html:u.rule}}/>`:html`<div className="r">Choose the correct translation. Words from your tests — repeat until automatic!</div>`}</div><div className="wrap" style=${{marginTop:0}}><button className="btn w" onClick=${()=>go('quiz',r.i)}>${t.startTest}</button><br/><br/><button className="btn w t" onClick=${()=>go('home',0,{back:1})}>${t.back}</button></div></div>`}
 else if(r.s=='quiz')c=html`<${Quiz} key=${r.i} i=${r.i} S=${S} save=${save} go=${go} lang=${lang}/>`;
 else if(r.s=='res')c=html`<${Res} r=${r} S=${S} go=${go} nav=${nav} lang=${lang}/>`;
 else c=html`<${Home} S=${S} go=${go} tab=${tab} nav=${nav} save=${save} lang=${lang}/>`;
 return html`<div><div className="spot"/><div className="blob" style=${{width:460,height:460,left:-120,top:60,background:'radial-gradient(circle,#bfdbff 0%,transparent 68%)'}}/><div className="blob" style=${{width:420,height:420,right:-100,top:140,background:'radial-gradient(circle,#ddd6fe 0%,transparent 68%)'}}/><div className="blob" style=${{width:420,height:420,left:'38%',bottom:-160,background:'radial-gradient(circle,#fbcfe8 0%,transparent 68%)'}}/>
 <header>
  <button className="logo" onClick=${()=>nav('home')} aria-label="Home"><${BookIc} size=${24} color="#4f8cff"/><span>English Project</span></button>
  <nav className="nav">${Object.entries(t.nav).map(([k,n])=>{
    const I=ICONS[{home:'Home',path:'Map',rules:'BookOpen',play:'Sparkles',tools:'Gamepad2',phr:'MessageSquare',verbs:'Flame',report:'Trophy'}[k]];
    return html`<button key=${k} className=${'nv '+(tab==k?'on':'')} onClick=${()=>nav(k)}>${tab==k&&html`<${motion.span} layoutId="navTab" className="nvp" transition=${{type:'spring',stiffness:380,damping:30}}/>`}<span style=${{position:'relative',display:'inline-flex',alignItems:'center',gap:6}}><${I} size=${16}/>${n}</span></button>`
  })}</nav>
  <div className="header-actions">
    <div className="lang-switch">
      <button className=${'lang-btn '+(lang==='ru'?'on':'')} onClick=${()=>setLang('ru')}>RU</button>
      <button className=${'lang-btn '+(lang==='en'?'on':'')} onClick=${()=>setLang('en')}>EN</button>
    </div>
    <span className="xp" title="Experience Points">⭐ ${S.xp||0}</span>
  </div>
 </header>
 <main><${AnimatePresence} mode="wait"><${motion.div} key=${r.s+(r.i??'')+(r.s=='home'?tab:'')+lang} initial=${{opacity:0,y:14}} animate=${{opacity:1,y:0}} exit=${{opacity:0}} transition=${{duration:.3}}>${r.s=='home'?c:html`<div className="lv">${c}</div>`}<//><//></main>
 <div className="bottomnav">${['home','path','rules','tools','verbs','phr','report'].map(k=>{
    const I=ICONS[{home:'Home',path:'Map',rules:'BookOpen',tools:'Gamepad2',verbs:'Flame',phr:'MessageSquare',report:'Trophy'}[k]];
    return html`<button key=${k} className=${tab===k?'on':''} onClick=${()=>nav(k)}><${I} size=${18}/>${t.nav[k]}</button>`
  })}</div></div>`}
const MC=MO&&MO.MotionConfig;
ReactDOM.createRoot(document.getElementById('root')).render(MC?html`<${MC} reducedMotion="user"><${App}/><//>`:html`<${App}/>`);
</script>
</body>
</html>
